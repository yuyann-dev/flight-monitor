name: Flight Price Crawler

on:
  schedule:
    - cron: '0 */1 * * *'  # 每小时跑一次
  workflow_dispatch:  # 手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install flyai CLI
        run: npm i -g @fly-ai/flyai-cli
        
      - name: Crawl prices
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          SERVER_TOKEN: ${{ secrets.SERVER_TOKEN }}
        run: node crawler.js
